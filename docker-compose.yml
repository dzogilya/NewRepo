services:
  # 1. Сховище даних PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: fractals-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fractals_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fractals_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis для Pub/Sub, кэшу та SSE
  redis:
    image: redis:7-alpine
    container_name: fractals-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. Генерація самопідписаного SSL сертифіката
  init-certs:
    image: alpine/openssl
    container_name: fractals-init-certs
    volumes:
      - ssl_certs:/etc/nginx/ssl
    entrypoint: >
      /bin/sh -c "
      if [ ! -f /etc/nginx/ssl/cert.pem ]; then
        echo 'Генерація нового SSL сертифіката...';
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
          -keyout /etc/nginx/ssl/key.pem \
          -out /etc/nginx/ssl/cert.pem \
          -subj '/C=UA/ST=Lviv/L=Lviv/O=Fractals/CN=localhost';
      else
        echo 'SSL сертифікат вже існує.';
      fi"

  # 4. Web API - Інстанс 1
  api1:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: fractals-api-1
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - INSTANCE_ID=api-node-1
      - ConnectionStrings__Database=${ConnectionStrings__Database:-Host=postgres;Port=5432;Database=fractals_db;Username=postgres;Password=postgres_secure_password}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-redis:6379}
      - Jwt__Secret=${Jwt__Secret:-SuperSecretLongSecureKeyForJwtTokens1234567890!@#$}
      - Jwt__Issuer=${Jwt__Issuer:-Fractals.Api}
      - Jwt__Audience=${Jwt__Audience:-Fractals.Client}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminSecurePassword123!}
    volumes:
      - shared_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Web API - Інстанс 2
  api2:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: fractals-api-2
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - INSTANCE_ID=api-node-2
      - ConnectionStrings__Database=${ConnectionStrings__Database:-Host=postgres;Port=5432;Database=fractals_db;Username=postgres;Password=postgres_secure_password}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-redis:6379}
      - Jwt__Secret=${Jwt__Secret:-SuperSecretLongSecureKeyForJwtTokens1234567890!@#$}
      - Jwt__Issuer=${Jwt__Issuer:-Fractals.Api}
      - Jwt__Audience=${Jwt__Audience:-Fractals.Client}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminSecurePassword123!}
    volumes:
      - shared_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 6. Обчислювальний сервер 1
  app1:
    build:
      context: .
      dockerfile: Dockerfile
      target: appserver
    container_name: fractals-app-1
    restart: always
    environment:
      - APP_SERVER_ID=app-node-1
      - APP_CONCURRENCY=${APP_CONCURRENCY:-2}
      - APP_CPU_THREADS=${APP_CPU_THREADS:-2}
      - ConnectionStrings__Database=${ConnectionStrings__Database:-Host=postgres;Port=5432;Database=fractals_db;Username=postgres;Password=postgres_secure_password}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-redis:6379}
    volumes:
      - shared_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 7. Обчислювальний сервер 2
  app2:
    build:
      context: .
      dockerfile: Dockerfile
      target: appserver
    container_name: fractals-app-2
    restart: always
    environment:
      - APP_SERVER_ID=app-node-2
      - APP_CONCURRENCY=${APP_CONCURRENCY:-2}
      - APP_CPU_THREADS=${APP_CPU_THREADS:-2}
      - ConnectionStrings__Database=${ConnectionStrings__Database:-Host=postgres;Port=5432;Database=fractals_db;Username=postgres;Password=postgres_secure_password}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-redis:6379}
    volumes:
      - shared_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 8. Демон автомасштабування (Autoscaler)
  autoscaler:
    build:
      context: .
      dockerfile: Dockerfile
      target: autoscaler
    container_name: fractals-autoscaler
    restart: always
    environment:
      - MIN_APP_SERVERS=${MIN_APP_SERVERS:-2}
      - MAX_APP_SERVERS=${MAX_APP_SERVERS:-6}
      - SCALE_UP_QUEUE_THRESHOLD=${SCALE_UP_QUEUE_THRESHOLD:-2}
      - SCALE_DOWN_IDLE_SECONDS=${SCALE_DOWN_IDLE_SECONDS:-30}
      - ConnectionStrings__Database=${ConnectionStrings__Database:-Host=postgres;Port=5432;Database=fractals_db;Username=postgres;Password=postgres_secure_password}
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-redis:6379}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 9. Nginx: Термінація HTTPS, Least_conn балансування, статика
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: fractals-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ssl_certs:/etc/nginx/ssl:ro
      - shared_storage:/app/storage:ro
    depends_on:
      - api1
      - api2
      - init-certs

volumes:
  pgdata:
  redisdata:
  ssl_certs:
  shared_storage:
