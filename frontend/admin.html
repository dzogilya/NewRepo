<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeatLab — адмін-панель</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>Heat<span>Lab</span> — адмін-панель</h1>
    <a href="/" class="btn">← До задач</a>
    <button onclick="logout()">Вийти</button>
  </header>

  <main>
    <p class="error" id="error"></p>

    <div class="card">
      <h2>Зараз</h2>
      <div class="counters" id="counters"></div>
    </div>

    <div class="card">
      <h2>Сервери</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Сервер</th><th>Порт</th><th>PID</th><th>Тип</th><th>Стан</th><th>Рахує задачу</th><th>Виконано</th><th>Запущено</th></tr>
          </thead>
          <tbody id="servers"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>Усі задачі (останні 50)</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Користувач</th><th>Трудомісткість</th><th>Стан</th><th>Прогрес</th><th>Сервер</th><th>Створено</th><th></th></tr>
          </thead>
          <tbody id="tasks"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
